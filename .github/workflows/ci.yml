name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # The tests read the built pages too.
      - run: npm test
      # nginx reads its configuration as the image will: the template filled in, then checked.
      - name: Check the nginx configuration
        run: |
          docker run --rm -e HODI_URL=http://app:3000 \
            -v "$PWD/nginx:/etc/nginx/templates:ro" nginx:1.30-alpine \
            sh -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && nginx -t'
